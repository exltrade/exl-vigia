name: Vigia de queda

on:
  schedule:
    # A cada 5 min, fora do minuto cheio (o GitHub atrasa mais os agendamentos no minuto 0).
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigia:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar API e ingestao
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: bash vigia.sh
      - name: Guardar o estado (so quando muda) e manter o agendamento vivo
        if: always()
        run: |
          git config user.name 'exl-vigia'
          git config user.email 'exl-vigia@users.noreply.github.com'
          # O GitHub desliga agendamento de repo publico com 60 dias sem commit: um commit a cada 30 dias evita.
          last=$(git log -1 --format=%ct)
          if (( $(date +%s) - last > 30*86400 )); then date -u +%FT%TZ > keepalive.txt; fi
          git add estado.txt keepalive.txt 2>/dev/null || true
          git diff --cached --quiet || { git commit -q -m "vigia: estado $(date -u +%FT%TZ)"; git push -q; }
